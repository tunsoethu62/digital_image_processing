[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "thai-university-uniform"
version = "0.1.0"
description = "Visible clothing detection and proposed uniform-rule assessment"
requires-python = ">=3.11,<3.14"
dependencies = ["ultralytics>=8.3,<9", "opencv-python>=4.10,<5", "numpy>=1.26,<3", "PyYAML>=6.0,<7", "streamlit>=1.40,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
uniform = "uniform_system.cli:main"
[tool.setuptools.packages.find]
include = ["uniform_system*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
